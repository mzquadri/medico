# Lint configuration only. This repository is a training script and a small
# support package, not an installable distribution.
#
# The rule set is pinned rather than left to ruff's defaults, which widen between
# releases. A check that passes locally and fails in CI is worse than no check.

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The training script is a long research script that predates this configuration.
# It is linted for real errors, not for style it was never written to.
"train_phase4_optimized.py" = [
    "E501",   # long lines
    "W291", "W293",  # trailing whitespace, cosmetic and a 350-line diff to fix
    "F541",   # f-strings with no placeholder, harmless
    "E402", "I001",  # imports deliberately follow the accelerator detection
    "F401",   # optional accelerator imports are probed, not used
    "RUF002", "RUF005", "RUF010", "RUF059",
    "SIM", "B007", "UP031", "UP015", "E741",
]
