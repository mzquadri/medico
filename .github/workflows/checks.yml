name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # CPU wheels: the runner has no accelerator, and the CPU build is the
        # smallest one that still exercises the model and the loss.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        # No dataset and no checkpoint are needed: the tests run on generated
        # noise and synthetic metadata.
        run: python -m pytest -q

      - name: Figures regenerate
        run: python scripts/figures/generate_figures.py
